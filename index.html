<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APK Patcher — واجهة الويب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#07060d; --card:rgba(20,17,32,.7); --border:rgba(139,92,246,.15);
  --accent:#8b5cf6; --accent-2:#06b6d4; --accent-3:#ec4899;
  --text:#f8fafc; --muted:#64748b; --dim:#334155;
  --green:#10b981; --red:#ef4444; --gold:#fbbf24;
  --mono:'JetBrains Mono',monospace; --orbit:'Orbitron',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Cairo',sans-serif;color:var(--text);min-height:100vh;padding:16px;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139,92,246,.15), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(6,182,212,.1), transparent),
    #07060d;
  background-attachment:fixed;
}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 8px 24px rgba(139,92,246,.4);transform:rotate(-6deg);
}
.brand-text{display:flex;flex-direction:column}
.brand-title{font-family:var(--orbit);font-size:14px;font-weight:800;letter-spacing:1.5px}
.brand-sub{font-size:9px;color:var(--muted);font-family:var(--mono)}

/* Card */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:24px 18px;backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* Sections */
.section{margin-bottom:20px}
.section:last-child{margin-bottom:0}
.section-title{
  font-family:var(--orbit);font-size:11px;font-weight:800;
  color:var(--accent-2);text-transform:uppercase;letter-spacing:1.5px;
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.section-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}

/* Dropzone */
.dz{
  border:2px dashed rgba(139,92,246,.3);border-radius:14px;padding:24px 16px;
  text-align:center;cursor:pointer;background:rgba(139,92,246,.02);
  transition:.2s;position:relative;
}
.dz:hover,.dz.drag{
  border-color:var(--accent);background:rgba(139,92,246,.06);
  box-shadow:0 0 30px rgba(139,92,246,.2);transform:translateY(-2px);
}
.dz-icon{font-size:32px;margin-bottom:8px}
.dz-title{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:4px}
.dz-hint{font-size:11px;color:var(--muted);font-family:var(--mono)}
.dz.has-file{border-color:var(--green);background:rgba(16,185,129,.05)}
.dz.has-file .dz-icon{color:var(--green)}
input[type=file]{display:none}

.file-info{
  background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);
  border-radius:10px;padding:10px 12px;margin-top:10px;
  display:none;justify-content:space-between;align-items:center;
}
.file-info.show{display:flex}
.file-name{font-family:var(--mono);font-size:11px;color:var(--green);font-weight:600;word-break:break-all}
.file-size{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* Flags grid */
.flags{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:6px;
}
.flag{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  background:rgba(139,92,246,.05);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;transition:.15s;user-select:none;
}
.flag:hover{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.08)}
.flag.checked{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.4)}
.flag input{display:none}
.flag-box{
  width:16px;height:16px;border-radius:4px;
  border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:.15s;font-size:11px;color:transparent;
}
.flag.checked .flag-box{background:var(--green);border-color:var(--green);color:#fff}
.flag-label{font-size:11px;font-weight:600;color:var(--text);flex:1;line-height:1.3}
.flag.checked .flag-label{color:var(--green)}
.flag-code{font-family:var(--mono);font-size:9px;color:var(--muted);display:block;margin-top:2px}

/* Buttons */
.btn{
  width:100%;padding:14px;border-radius:12px;border:none;
  font-family:'Cairo';font-weight:800;font-size:14px;cursor:pointer;
  transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 6px 20px rgba(139,92,246,.4);
}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(139,92,246,.6)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-success{
  background:linear-gradient(135deg,var(--green),#059669);color:#fff;
  box-shadow:0 6px 20px rgba(16,185,129,.4);
}
.btn-success:hover{transform:translateY(-2px)}

/* Progress */
.progress{display:none;margin-top:16px}
.progress.active{display:block}
.progress-bar{
  height:8px;background:rgba(139,92,246,.1);border-radius:4px;
  overflow:hidden;margin-bottom:8px;position:relative;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  border-radius:4px;transition:width .3s;position:relative;
}
.progress-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:shimmer 1.2s infinite;
}
@keyframes shimmer{to{transform:translateX(200%)}}
.progress-txt{text-align:center;font-size:11px;color:var(--accent);font-weight:600;font-family:var(--mono)}

/* Alerts */
.alert{
  padding:12px 14px;border-radius:12px;font-size:12px;
  display:none;margin-top:12px;align-items:flex-start;gap:10px;
  border:1px solid;
}
.alert.show{display:flex}
.alert.error{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fca5a5}
.alert.success{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:#6ee7b7}
.alert-icon{font-size:16px}

/* Footer */
.footer{text-align:center;font-size:10px;color:var(--dim);padding:10px 20px;font-family:var(--mono)}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-mark">🛠️</div>
      <div class="brand-text">
        <div class="brand-title">APK PATCHER</div>
        <div class="brand-sub">web interface · v1.0</div>
      </div>
    </div>
  </div>

  <!-- Upload Card -->
  <div class="card">
    <div class="section">
      <div class="section-title">1. رفع التطبيق</div>
      <div class="dz" id="dropzone">
        <div class="dz-icon">📦</div>
        <div class="dz-title">+ اختيار APK</div>
        <div class="dz-hint">.apk · .apks · .apkm · .xapk (حد 200MB)</div>
      </div>
      <input type="file" id="fileInput" accept=".apk,.apks,.apkm,.xapk">
      <div class="file-info" id="fileInfo">
        <div class="file-name" id="fileName">-</div>
        <div class="file-size" id="fileSize">-</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">2. اختيار الفلاجات</div>
      <div class="flags" id="flagsGrid">
        <label class="flag checked" data-flag="-ssl">
          <input type="checkbox" checked>
          <span class="flag-box">✓</span>
          <span class="flag-label">SSL Bypass<span class="flag-code">-ssl</span></span>
        </label>
        <label class="flag checked" data-flag="-fix">
          <input type="checkbox" checked>
          <span class="flag-box">✓</span>
          <span class="flag-label">Fix Install<span class="flag-code">-fix</span></span>
        </label>
        <label class="flag" data-flag="-rmads">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">Remove Ads<span class="flag-code">-rmads</span></span>
        </label>
        <label class="flag" data-flag="-rmss">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">No Screenshots<span class="flag-code">-rmss</span></span>
        </label>
        <label class="flag" data-flag="-id">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">Multi-Device<span class="flag-code">-id</span></span>
        </label>
        <label class="flag" data-flag="-v">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">VPN Bypass<span class="flag-code">-v</span></span>
        </label>
        <label class="flag" data-flag="-rmusb">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">USB Bypass<span class="flag-code">-rmusb</span></span>
        </label>
        <label class="flag" data-flag="-paid">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">Paid Preview<span class="flag-code">-paid</span></span>
        </label>
        <label class="flag" data-flag="-pkg">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">Pkg Spoof<span class="flag-code">-pkg</span></span>
        </label>
        <label class="flag" data-flag="-pine">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">Pine Hook<span class="flag-code">-pine</span></span>
        </label>
        <label class="flag" data-flag="-a">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">Logs<span class="flag-code">-a</span></span>
        </label>
        <label class="flag" data-flag="-tg">
          <input type="checkbox">
          <span class="flag-box">✓</span>
          <span class="flag-label">Telegram Patch<span class="flag-code">-tg</span></span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">3. بدء التعديل</div>
      <button class="btn btn-primary" id="btnStart" disabled>
        🚀 بدء التعديل
      </button>
      <div class="progress" id="progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-txt" id="progressTxt">جاري المعالجة...</div>
      </div>
      <div class="alert error" id="alertError">
        <span class="alert-icon">❌</span>
        <span id="errorText"></span>
      </div>
      <div class="alert success" id="alertSuccess">
        <span class="alert-icon">✅</span>
        <span id="successText"></span>
      </div>
      <button class="btn btn-success" id="btnDownload" style="display:none">
        ⬇️ تحميل الملف المعدل
      </button>
    </div>
  </div>

  <div class="footer">
    APK Patcher Web · Powered by APKPatcher.jar
  </div>
</div>

<script>
const API = window.location.origin;
let currentSession = null;
let pollingInterval = null;

const $ = id => document.getElementById(id);
const dropzone = $('dropzone');
const fileInput = $('fileInput');
const fileInfo = $('fileInfo');
const fileName = $('fileName');
const fileSize = $('fileSize');
const btnStart = $('btnStart');
const btnDownload = $('btnDownload');
const progress = $('progress');
const progressFill = $('progressFill');
const progressTxt = $('progressTxt');
const alertError = $('alertError');
const alertSuccess = $('alertSuccess');

// ============================================================
// File selection
// ============================================================
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) uploadFile(e.target.files[0]);
});

async function uploadFile(file) {
  const ext = '.' + file.name.split('.').pop().toLowerCase();
  if (!['.apk', '.apks', '.apkm', '.xapk'].includes(ext)) {
    showError('صيغة غير مدعومة');
    return;
  }
  if (file.size > 200 * 1024 * 1024) {
    showError('الحجم أكبر من 200MB');
    return;
  }

  hideAlerts();
  dropzone.classList.add('has-file');
  fileName.textContent = file.name;
  fileSize.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
  fileInfo.classList.add('show');

  // رفع
  const fd = new FormData();
  fd.append('file', file);

  try {
    btnStart.disabled = true;
    btnStart.textContent = '⏳ جاري الرفع...';
    progress.classList.add('active');
    progressFill.style.width = '5%';
    progressTxt.textContent = 'رفع الملف...';

    const r = await fetch(`${API}/api/upload`, {
      method: 'POST',
      body: fd,
    });

    const data = await r.json();
    if (data.error) throw new Error(data.error);

    currentSession = data.session_id;
    progressFill.style.width = '100%';
    progressTxt.textContent = 'تم الرفع ✓';
    btnStart.disabled = false;
    btnStart.textContent = '🚀 بدء التعديل';

    setTimeout(() => {
      progress.classList.remove('active');
    }, 1000);

  } catch (err) {
    showError(err.message);
    btnStart.disabled = true;
    btnStart.textContent = '🚀 بدء التعديل';
    progress.classList.remove('active');
  }
}

// ============================================================
// Flags toggle
// ============================================================
document.querySelectorAll('.flag').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const cb = el.querySelector('input');
    cb.checked = !cb.checked;
    el.classList.toggle('checked', cb.checked);
  });
});

function getSelectedFlags() {
  return Array.from(document.querySelectorAll('.flag.checked')).map(el => el.dataset.flag);
}

// ============================================================
// Start patch
// ============================================================
btnStart.addEventListener('click', async () => {
  if (!currentSession) {
    showError('ارفع الملف أولاً');
    return;
  }

  hideAlerts();
  btnDownload.style.display = 'none';
  btnStart.disabled = true;
  btnStart.textContent = '⏳ جاري المعالجة...';
  progress.classList.add('active');
  progressFill.style.width = '5%';
  progressTxt.textContent = 'بدء...';

  try {
    const flags = getSelectedFlags();
    const r = await fetch(`${API}/api/patch`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: currentSession, flags}),
    });

    const data = await r.json();
    if (data.error) throw new Error(data.error);

    // بدء polling
    pollingInterval = setInterval(checkStatus, 1000);

  } catch (err) {
    showError(err.message);
    btnStart.disabled = false;
    btnStart.textContent = '🚀 بدء التعديل';
    progress.classList.remove('active');
  }
});

async function checkStatus() {
  if (!currentSession) return;

  try {
    const r = await fetch(`${API}/api/status/${currentSession}`);
    const data = await r.json();

    if (data.error) {
      clearInterval(pollingInterval);
      showError(data.error);
      resetButton();
      return;
    }

    progressFill.style.width = data.percent + '%';
    progressTxt.textContent = data.message || `معالجة... ${data.percent}%`;

    if (data.status === 'done') {
      clearInterval(pollingInterval);
      progressFill.style.width = '100%';
      progressTxt.textContent = '✅ اكتمل';
      btnStart.textContent = '✅ تم التعديل';
      showSuccess('تم تعديل الملف بنجاح!');
      btnDownload.style.display = 'flex';
      btnDownload.onclick = () => {
        window.location.href = `${API}/api/download/${currentSession}`;
      };
    } else if (data.status === 'error') {
      clearInterval(pollingInterval);
      showError(data.message || 'فشل التعديل');
      resetButton();
    }

  } catch (err) {
    clearInterval(pollingInterval);
    showError('انقطع الاتصال');
    resetButton();
  }
}

function resetButton() {
  btnStart.disabled = false;
  btnStart.textContent = '🚀 بدء التعديل';
}

function showError(msg) {
  alertError.classList.add('show');
  $('errorText').textContent = msg;
  alertSuccess.classList.remove('show');
}

function showSuccess(msg) {
  alertSuccess.classList.add('show');
  $('successText').textContent = msg;
  alertError.classList.remove('show');
}

function hideAlerts() {
  alertError.classList.remove('show');
  alertSuccess.classList.remove('show');
}
</script>
</body>
</html>
